[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "jsonschema>=4.0",  # validates emitted DetectionVerdicts against the PINNED contract
]

[tool.pytest.ini_options]
# importlib import mode + src layout: lets the three packages' identically-named
# `tests` dirs coexist in one workspace run without sys.modules name collisions.
# --ignore-glob drops packages/*/experiments/ — unpackaged scratch/demo scripts
# (some named *_test.py) whose sibling imports break a root collection run.
addopts = "--import-mode=importlib --ignore-glob=*/experiments/*"
testpaths = ["packages"]
