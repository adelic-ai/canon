[package]
name = "motif-rs"
version = "0.1.0"
edition = "2021"
description = "Native interpreter for canon's detection IR — the hot-path emitter. canon is one consumer."

[[bin]]
name = "motif-rs"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex = "1"
rayon = "1"

[profile.release]
opt-level = 3
