[project]
name = "semantic-core"
version = "0.0.1"
description = "Typed wrappers over the W3C semantic stack (rdflib + owlready2 + pySHACL) plus FCA implication-basis extraction"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "owlready2>=0.50",
    "pyshacl>=0.25",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_core"]
