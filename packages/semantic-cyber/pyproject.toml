[project]
name = "semantic-cyber"
version = "0.0.1"
description = "Cyber domain ontology adapters — D3FEND, ATT&CK, framework bridges"
requires-python = ">=3.11"
dependencies = [
    "semantic-core",
    "rdflib>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_cyber"]

[tool.uv.sources]
semantic-core = { workspace = true }
