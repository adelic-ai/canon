[project]
name = "omega"
version = "0.1.0"
description = "FCA/SKOS rule-sameness over all of Sigma — structure first, behavior later."
requires-python = ">=3.11"
dependencies = ["pysigma>=1.4,<2"]

[project.scripts]
omega = "omega.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omega"]
