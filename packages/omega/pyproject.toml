[project]
name = "omega"
version = "0.1.0"
description = "Analyzes whether two detection rules are the same — ingests Sigma & MITRE CAR into a ruleset-agnostic IR, then derives FCA concepts and SKOS graded relations. Sameness is a tunable semantic projection."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pysigma>=1.4,<2", "pyyaml>=6"]

[project.scripts]
omega = "omega.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omega"]
